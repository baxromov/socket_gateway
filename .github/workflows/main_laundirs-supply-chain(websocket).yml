# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - laundirs-supply-chain(websocket)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://laundrisprod001.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_bdaeaff7ca224f728225c79d7f31ff6e }}
        password: ${{ secrets.AzureAppService_ContainerPassword_13af3c95ce544295a8046dae918843d4 }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: laundrisprod001.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_bdaeaff7ca224f728225c79d7f31ff6e }}/laundris-supply-chain-socket:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'websocket'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'laundirs-supply-chain'
        slot-name: 'websocket'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_827a40cdda0f4c9e8a8ddfeae02b2eea }}
        images: 'laundrisprod001.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_bdaeaff7ca224f728225c79d7f31ff6e }}/laundris-supply-chain-socket:${{ github.sha }}'